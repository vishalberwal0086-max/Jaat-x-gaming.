html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAAT X GAMING</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #222;
}
header h1{margin:0;color:#00ff66}
.chat{
  max-width:700px;
  margin:20px auto;
  padding:15px;
}
input,button{
  padding:13px;
  border-radius:8px;
  border:1px solid #333;
  background:#151515;
  color:white;
}
input{width:100%;margin-bottom:10px}
button{
  background:#00c853;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
#messages{
  height:400px;
  overflow-y:auto;
  border:1px solid #222;
  border-radius:10px;
  padding:12px;
  margin:15px 0;
  background:#0d0d0d;
}
.msg{
  background:#171717;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}
.name{
  color:#00ff66;
  font-weight:bold;
}
.time{
  color:#777;
  font-size:11px;
}
.row{
  display:flex;
  gap:8px;
}
.row input{margin:0}
.row button{width:100px}
</style>
</head>

<body>

<header>
  <h1>🎮 JAAT X GAMING</h1>
  <p>💬 Live Gaming Chat</p>
</header>

<div class="chat">

  <input id="username" placeholder="Apna naam likho">

  <div id="messages">
    Loading chat...
  </div>

  <div class="row">
    <input id="message" placeholder="Message likho...">
    <button onclick="sendMessage()">SEND</button>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB2F5Ubqz9zr40U0YwNtFSvZaPylm9lhoQ",
  authDomain: "jaat-x-gaming.firebaseapp.com",
  databaseURL: "https://jaat-x-gaming-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jaat-x-gaming",
  storageBucket: "jaat-x-gaming.firebasestorage.app",
  messagingSenderId: "479992655799",
  appId: "1:479992655799:web:89c76ebb0d389521e84232",
  measurementId: "G-8QL4YV988R"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

function sendMessage(){
  const name = document.getElementById("username").value.trim();
  const text = document.getElementById("message").value.trim();

  if(!name || !text){
    alert("Naam aur message dono likho!");
    return;
  }

  db.ref("messages").push({
    name:name,
    text:text,
    time:Date.now()
  });

  document.getElementById("message").value="";
}

db.ref("messages").limitToLast(100).on("value", snapshot => {
  const box=document.getElementById("messages");
  box.innerHTML="";

  snapshot.forEach(child => {
    const data=child.val();

    const div=document.createElement("div");
    div.className="msg";

    div.innerHTML =
      '<div class="name"></div>' +
      '<div class="text"></div>' +
      '<div class="time"></div>';

    div.querySelector(".name").textContent=data.name;
    div.querySelector(".text").textContent=data.text;
    div.querySelector(".time").textContent=
      new Date(data.time).toLocaleString();

    box.appendChild(div);
  });

  box.scrollTop=box.scrollHeight;
});
</script>

</body>
</html>
